[project]
name = "bowling-shoot"
version = "0.1.0"
description = "Bowling pin shooting competition tracker using computer vision"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.14.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Ruff code linter and formatter configuration
[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = [
    "I", # isort
    "D", # Docstrings. Define the type below.
    #   "E501", # Line too long.
]

# Pydocstyle configuration for docstring formatting conventions
[tool.ruff.lint.pydocstyle]
convention = "google"
